
public interface IMonitoringModule
{
    string Id { get; }
    string DisplayName { get; }

    Task InitializeAsync(
        CancellationToken cancellationToken);

    Task<ModuleStatus> GetStatusAsync(
        CancellationToken cancellationToken);

    Task<IReadOnlyList<MetricSample>> CollectAsync(
        CancellationToken cancellationToken);

    Task StopAsync(
        CancellationToken cancellationToken);
}

public sealed record MetricSample(
    string MetricId,
    double? Value,
    string Unit,
    DateTimeOffset Timestamp,
    string Source,
    MetricQuality Quality);

public enum MetricQuality
{
    Valid,
    Estimated,
    Unavailable,
    Stale,
    Error
}

public sealed record ModuleStatus(
    bool IsAvailable,
    string Message);
