name: PC Control Center - Build Windows

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Compile and package Windows app
runs-on: windows-latest
timeout-minutes: 15

```
steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Setup MSBuild
    uses: microsoft/setup-msbuild@v2

  - name: Locate project
    id: locate
    shell: pwsh
    run: |
      $solutions = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter *.sln)
      $projects = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter *.csproj)

      if ($solutions.Count -gt 0) {
        $selected = $solutions[0].FullName
        "PROJECT_PATH=$selected" >> $env:GITHUB_ENV
        "PROJECT_KIND=sln" >> $env:GITHUB_ENV
        Write-Host "Solution found: $selected"
      }
      elseif ($projects.Count -gt 0) {
        $selected = $projects[0].FullName
        "PROJECT_PATH=$selected" >> $env:GITHUB_ENV
        "PROJECT_KIND=csproj" >> $env:GITHUB_ENV
        Write-Host "Project found: $selected"
      }
      else {
        throw "No .sln or .csproj found. Add the actual C# project to this repository."
      }

  - name: Build Release
    shell: pwsh
    run: |
      Write-Host "Building: $env:PROJECT_PATH"

      msbuild "$env:PROJECT_PATH" `
        /restore `
        /m `
        /verbosity:minimal `
        /p:Configuration=Release `
        /p:ContinuousIntegrationBuild=true

      if ($LASTEXITCODE -ne 0) {
        throw "Build failed. Read the MSBuild errors above."
      }

  - name: Find executable and prepare package
    shell: pwsh
    run: |
      $workspace = $env:GITHUB_WORKSPACE

      $executables = @(
        Get-ChildItem -Path $workspace -Recurse -File -Filter *.exe |
        Where-Object {
          $_.FullName -match '[\\/]bin[\\/]Release[\\/]' -and
          $_.Name -notmatch '^(testhost|.*\.vshost)\.exe$' -and
          $_.FullName -notmatch '[\\/]obj[\\/]'
        }
      )

      if ($executables.Count -eq 0) {
        throw "Build completed but no executable was found. Check the project OutputType and build logs."
      }

      $preferred = @(
        $executables | Where-Object {
          $_.Name -in @(
            'PCControlCenter.exe',
            'PCControlCenter.App.exe'
          )
        }
      )

      if ($preferred.Count -gt 0) {
        $exe = $preferred[0]
      }
      elseif ($executables.Count -eq 1) {
        $exe = $executables[0]
      }
      else {
        Write-Host "Executables found:"
        $executables | ForEach-Object { Write-Host $_.FullName }
        throw "Several executables were found and the main application could not be identified."
      }

      Write-Host "Application executable: $($exe.FullName)"

      $outputDirectory = Join-Path $workspace 'dist'
      New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

      $buildDirectory = $exe.Directory.FullName

      Get-ChildItem -Path $buildDirectory -Force |
        Copy-Item -Destination $outputDirectory -Recurse -Force

      $packagedExe = Join-Path $outputDirectory $exe.Name

      if (-not (Test-Path $packagedExe)) {
        throw "The executable was not copied into the package."
      }

      $zipPath = Join-Path $workspace 'PCControlCenter-Portable-x64.zip'

      Compress-Archive `
        -Path (Join-Path $outputDirectory '*') `
        -DestinationPath $zipPath `
        -Force

      Write-Host "Package contents:"
      Get-ChildItem -Path $outputDirectory -Recurse |
        Select-Object FullName, Length

      Write-Host "ZIP created: $zipPath"

  - name: Upload Windows application
    uses: actions/upload-artifact@v4
    with:
      name: PCControlCenter-Windows-x64
      path: |
        dist/**
        PCControlCenter-Portable-x64.zip
      if-no-files-found: error
      retention-days: 14
```
