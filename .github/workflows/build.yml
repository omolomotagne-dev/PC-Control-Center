name: PC Control Center - Build Windows EXE

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Recuperer le code source
    uses: actions/checkout@v4

  - name: Configurer MSBuild
    uses: microsoft/setup-msbuild@v2

  - name: Trouver le projet
    shell: pwsh
    run: |
      $solution = Get-ChildItem -Path . -Recurse -Filter *.sln |
        Select-Object -First 1

      if ($solution) {
        "PROJECT_PATH=$($solution.FullName)" >> $env:GITHUB_ENV
      } else {
        $project = Get-ChildItem -Path . -Recurse -Filter *.csproj |
          Select-Object -First 1

        if (-not $project) {
          throw "Aucun fichier .sln ou .csproj trouve. Ajoute le vrai projet C# au depot."
        }

        "PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV
      }

  - name: Compiler en Release
    shell: pwsh
    run: |
      msbuild "$env:PROJECT_PATH" /restore /m /p:Configuration=Release

      if ($LASTEXITCODE -ne 0) {
        throw "La compilation a echoue."
      }

  - name: Verifier et preparer les fichiers
    shell: pwsh
    run: |
      $exe = Get-ChildItem -Path . -Recurse -Filter PCControlCenter.exe |
        Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]' } |
        Select-Object -First 1

      if (-not $exe) {
        throw "Compilation terminee, mais PCControlCenter.exe est introuvable. Verifie le nom et le type du projet."
      }

      $output = Join-Path $PWD "dist"
      New-Item -ItemType Directory -Path $output -Force | Out-Null

      $buildFolder = $exe.Directory.FullName
      Copy-Item -Path (Join-Path $buildFolder "*") -Destination $output -Recurse -Force

      Compress-Archive -Path (Join-Path $output "*") `
        -DestinationPath (Join-Path $PWD "PCControlCenter-Portable-x64.zip") -Force

  - name: Publier EXE et ZIP
    uses: actions/upload-artifact@v4
    with:
      name: PCControlCenter-Windows-x64
      path: |
        dist/**
        PCControlCenter-Portable-x64.zip
      if-no-files-found: error
```
