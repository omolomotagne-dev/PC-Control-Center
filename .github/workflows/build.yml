name: Build PC Control Center

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Recuperer le code
    uses: actions/checkout@v4

  - name: Installer MSBuild
    uses: microsoft/setup-msbuild@v2

  - name: Verifier les fichiers du projet
    shell: pwsh
    run: |
      Write-Host "Recherche des projets C#..."
      Get-ChildItem -Recurse -Include *.sln,*.csproj |
        Select-Object -ExpandProperty FullName

  - name: Compiler le projet WPF
    shell: pwsh
    run: |
      $projects = Get-ChildItem -Recurse -Filter *.sln
      if (-not $projects) {
        $projects = Get-ChildItem -Recurse -Filter *.csproj
      }
      if (-not $projects) {
        throw "Aucun fichier .sln ou .csproj trouve dans le depot."
      }

      foreach ($project in $projects) {
        msbuild $project.FullName /restore /p:Configuration=Release /m
        if ($LASTEXITCODE -ne 0) {
          throw "La compilation a echoue : $($project.Name)"
        }
      }

  - name: Rechercher l executable
    shell: pwsh
    run: |
      $exe = Get-ChildItem -Recurse -Filter PCControlCenter.exe |
        Where-Object { $_.FullName -match '\\bin\\Release\\' }

      if (-not $exe) {
        throw "Compilation terminee mais PCControlCenter.exe introuvable."
      }

      New-Item -ItemType Directory -Force -Path dist | Out-Null
      Copy-Item $exe[0].FullName dist/
      Get-ChildItem dist

  - name: Publier le vrai executable
    uses: actions/upload-artifact@v4
    with:
      name: PCControlCenter-Windows
      path: dist/
      if-no-files-found: error
