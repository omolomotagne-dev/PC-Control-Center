name: PC Control Center Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: windows-latest
timeout-minutes: 20

```
steps:
  - name: Download source
    uses: actions/checkout@v4

  - name: Setup MSBuild
    uses: microsoft/setup-msbuild@v2

  - name: Find and compile project
    shell: pwsh
    run: |
      $root = $env:GITHUB_WORKSPACE

      $solution = Get-ChildItem $root -Recurse -File -Filter *.sln |
        Select-Object -First 1

      if ($solution) {
        $projectPath = $solution.FullName
      } else {
        $project = Get-ChildItem $root -Recurse -File -Filter *.csproj |
          Select-Object -First 1

        if (-not $project) {
          throw "ERROR: No C# solution or project found in the repository."
        }

        $projectPath = $project.FullName
      }

      Write-Host "Project: $projectPath"

      msbuild "$projectPath" /restore /m /p:Configuration=Release /verbosity:minimal

      if ($LASTEXITCODE -ne 0) {
        throw "ERROR: Compilation failed. Check the MSBuild log."
      }

  - name: Find the compiled application
    shell: pwsh
    run: |
      $root = $env:GITHUB_WORKSPACE

      $exeFiles = @(
        Get-ChildItem $root -Recurse -File -Filter *.exe |
        Where-Object {
          $_.FullName -match '[\\/]bin[\\/]Release[\\/]' -and
          $_.FullName -notmatch '[\\/]obj[\\/]'
        }
      )

      if ($exeFiles.Count -eq 0) {
        throw "ERROR: Build succeeded but no EXE was found."
      }

      $exe = $exeFiles |
        Where-Object {
          $_.Name -eq "PCControlCenter.exe" -or
          $_.Name -eq "PCControlCenter.App.exe"
        } |
        Select-Object -First 1

      if (-not $exe) {
        if ($exeFiles.Count -eq 1) {
          $exe = $exeFiles[0]
        } else {
          $exeFiles | ForEach-Object {
            Write-Host $_.FullName
          }
          throw "ERROR: Multiple EXE files found. Main application is ambiguous."
        }
      }

      $output = Join-Path $root "dist"
      New-Item -ItemType Directory -Path $output -Force | Out-Null

      Copy-Item -Path (Join-Path $exe.Directory.FullName "*") -Destination $output -Recurse -Force

      if (-not (Test-Path (Join-Path $output $exe.Name))) {
        throw "ERROR: EXE copy failed."
      }

      Compress-Archive -Path (Join-Path $output "*") -DestinationPath (Join-Path $root "PCControlCenter-Portable-x64.zip") -Force

      Write-Host "Application found: $($exe.Name)"
      Write-Host "Portable ZIP created."

  - name: Upload application files
    uses: actions/upload-artifact@v4
    with:
      name: PCControlCenter-Windows-x64
      path: |
        dist/
        PCControlCenter-Portable-x64.zip
      if-no-files-found: error
      retention-days: 14
```
